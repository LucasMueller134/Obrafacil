name: obra_facil
description: >-
  Gestão inteligente de obras na palma da mão — controle de custos, equipe e
  progresso com IA on-device. TCC de Engenharia de Software (CatólicaSC).
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Firebase (nuvem + sincronização offline nativa do Firestore)
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4

  # Estado e navegação
  provider: ^6.1.2
  go_router: ^14.3.0

  # UI
  google_fonts: ^6.2.1
  fl_chart: ^0.69.0
  cached_network_image: ^3.4.1
  flutter_animate: ^4.5.0
  # Maquete 3D da obra (Flutter GPU). Versão exata: o pacote é pré-1.0 e
  # versões menores trazem mudanças incompatíveis. Exige Flutter 3.47+.
  flutter_scene: 0.24.3
  hooks: ^2.0.0 # usado pelo hook/build.dart criado pelo flutter_scene:init

  # Câmera e processamento de imagem
  image_picker: ^1.1.2
  image: ^4.2.0

  # IA on-device
  google_mlkit_text_recognition: ^0.14.0 # OCR de notas fiscais (offline)
  google_mlkit_image_labeling: ^0.13.0 # reconhecimento de materiais (offline)
  google_mlkit_barcode_scanning: ^0.13.0 # QR da NFC-e e código de barras do DANFE (offline)
  path_provider: ^2.1.5 # cópia local do modelo próprio de fases (opcional)
  speech_to_text: ^7.0.0 # lançamento por voz

  # Notificações fora do app
  flutter_local_notifications: ^19.0.0
  timezone: ^0.10.0
  flutter_timezone: ^4.0.0
  workmanager: ^0.10.0 # verificador em segundo plano (aprovações, alertas)
  shared_preferences: ^2.3.0

  # Utilitários
  intl: any # versão gerenciada pelo flutter_localizations
  uuid: ^4.5.1
  share_plus: ^10.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.1

flutter:
  uses-material-design: true
  assets:
    # Modelo próprio de fases da obra (opcional) — ver docs/ia/treinar-modelo.md.
    # Sem o fases_obra.tflite aqui, o app usa só o modelo base do ML Kit.
    - assets/modelos/
    # Maquete 3D: o .glb em assets/3d/ é convertido pelo hook do
    # flutter_scene (não listar a pasta inteira, senão ele vai duas vezes);
    # aqui entram só o manifesto e as imagens de reserva.
    - assets/3d/maquete.json
    - assets/3d/reserva/claro/
    - assets/3d/reserva/escuro/
    - flutter_scene_generated/
    - path: flutter_scene_generated/metal_ios/
      platforms:
        - ios
    - path: flutter_scene_generated/metal_desktop/
      platforms:
        - macos
    - path: flutter_scene_generated/opengl_es_vulkan/
      platforms:
        - android
        - linux
        - windows
    - path: flutter_scene_generated/opengl_es/
      platforms:
        - web

  # Fontes embutidas (o canteiro fica sem sinal). Ver assets/fontes/LEIA-ME.md.
  fonts:
    - family: Archivo
      fonts:
        - asset: assets/fontes/Archivo-SemiCondensed-SemiBold.ttf
          weight: 600
        - asset: assets/fontes/Archivo-SemiCondensed-Bold.ttf
          weight: 700
        - asset: assets/fontes/Archivo-SemiCondensed-ExtraBold.ttf
          weight: 800
    - family: Atkinson
      fonts:
        - asset: assets/fontes/AtkinsonHyperlegibleNext-Regular.ttf
          weight: 400
        - asset: assets/fontes/AtkinsonHyperlegibleNext-Medium.ttf
          weight: 500
        - asset: assets/fontes/AtkinsonHyperlegibleNext-Bold.ttf
          weight: 700
    - family: PlexMono
      fonts:
        - asset: assets/fontes/IBMPlexMono-Regular.ttf
          weight: 400
        - asset: assets/fontes/IBMPlexMono-Medium.ttf
          weight: 500

# Ícone do launcher — gerado no CI com: dart run flutter_launcher_icons
# Fonte e exportação em ferramentas/icone/ (ver o LEIA-ME.md de lá).
flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icone/icon.png
  adaptive_icon_background: '#F4F5F3'
  adaptive_icon_foreground: assets/icone/icon_foreground.png
  # As camadas já vêm no quadro de 108 dp, dentro do círculo de 66 dp.
  # Sem o 0, o pacote põe um inset de 16% e encolhe o desenho.
  adaptive_icon_foreground_inset: 0
  adaptive_icon_monochrome: assets/icone/icon_monochrome.png

# Splash nativa — gerada no CI com: dart run flutter_native_splash:create
flutter_native_splash:
  color: '#F4F5F3'
  image: assets/icone/splash.png
  color_dark: '#121315'
  image_dark: assets/icone/splash_escuro.png
  android_12:
    color: '#F4F5F3'
    image: assets/icone/splash.png
    color_dark: '#121315'
    image_dark: assets/icone/splash_escuro.png
