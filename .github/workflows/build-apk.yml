# Compila o APK do Obra na Mão na nuvem a cada push na master.
#
# Por que o scaffold Android é gerado aqui e não commitado: a máquina local
# está atrás de firewall (FortiNet) que bloqueia o pub.dev, então o
# `flutter create` roda no runner. Isso também garante que o scaffold sempre
# combina com a versão do Flutter usada no build.
#
# O APK sai na aba "Releases" do repositório — dá para baixar direto pelo
# navegador do celular e instalar.
name: Build APK

on:
  push:
    branches: [master, main]
  workflow_dispatch: {} # permite disparar manualmente pela aba Actions

permissions:
  contents: write # necessário para publicar a Release com o APK

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: obra_facil
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          # Versão fixa: o canal "stable" mudou sozinho e quebrou a
          # compilação do workmanager (build #20). Builds reprodutíveis
          # pedem versão pinada — atualizar aqui de forma consciente.
          # 3.47+ é exigido pelo flutter_scene (maquete 3D, Flutter GPU).
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      - name: Gerar scaffold Android
        run: |
          # O flutter create reescreve o pubspec.lock do zero (só com os
          # pacotes do SDK) e o pub get dele resolve o resto na versão mais
          # nova que o pubspec aceita: sem isto o lock versionado é ignorado
          # e cada build pega versões de plugin diferentes.
          cp pubspec.lock "$RUNNER_TEMP/pubspec.lock"
          flutter create . --platforms android --org br.com.obrafacil --project-name obra_facil
          cp "$RUNNER_TEMP/pubspec.lock" pubspec.lock
          # o flutter create cria um widget_test.dart de exemplo que não compila com o nosso app
          rm -f test/widget_test.dart

      - name: Ajustar permissões, nome do app e Flutter GPU
        run: |
          # Cada sed é conferido: se o template do flutter create mudar, o
          # build para aqui em vez de seguir sem a configuração.
          confere() { grep -qF -- "$2" "$1" || { echo "::error file=$1::texto esperado não encontrado: $2"; exit 1; }; }
          # minSdk: fica o do Flutter (flutter.minSdkVersion = 24), que cobre o
          # Android 6.0+ (23) exigido pelo firebase_auth. Não adianta fixar 23:
          # o `flutter build apk` devolve qualquer minSdk < 24 para
          # flutter.minSdkVersion (MinSdkVersionMigration do Flutter).
          confere android/app/build.gradle.kts 'minSdk = flutter.minSdkVersion'
          # desliga a minificação R8 no release: o plugin de OCR referencia
          # classes de idiomas (chinês/japonês/coreano) que não incluímos,
          # e o R8 falha com "missing classes" ao tentar encolher o app
          confere android/app/build.gradle.kts 'signingConfig = signingConfigs.getByName("debug")'
          sed -i 's/signingConfig = signingConfigs.getByName("debug")/signingConfig = signingConfigs.getByName("debug")\n            isMinifyEnabled = false\n            isShrinkResources = false/' android/app/build.gradle.kts
          confere android/app/build.gradle.kts 'isMinifyEnabled = false'
          grep -A4 'release {' android/app/build.gradle.kts || true
          MANIFEST=android/app/src/main/AndroidManifest.xml
          # nome exibido no launcher
          confere "$MANIFEST" 'android:label="obra_facil"'
          sed -i 's/android:label="obra_facil"/android:label="Obra na Mão"/' "$MANIFEST"
          # permissões: internet (Firebase) e microfone (lançamento por voz);
          # queries para o serviço de reconhecimento de fala (Android 11+)
          confere "$MANIFEST" '<manifest xmlns:android="http://schemas.android.com/apk/res/android">'
          sed -i 's#<manifest xmlns:android="http://schemas.android.com/apk/res/android">#<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n    <uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.RECORD_AUDIO"/>\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/>\n    <uses-permission android:name="android.permission.VIBRATE"/>\n    <uses-permission android:name="android.permission.WAKE_LOCK"/>\n    <queries>\n        <intent>\n            <action android:name="android.speech.RecognitionService"/>\n        </intent>\n    </queries>#' "$MANIFEST"
          confere "$MANIFEST" 'android.permission.RECORD_AUDIO'
          # Flutter GPU (maquete 3D do flutter_scene) vem desligado; liga
          # dentro de <application>. Sem isto o Scene() do flutter_scene lança
          # exceção ("Flutter GPU must be enabled...").
          confere "$MANIFEST" '</application>'
          sed -i 's#^\( *\)</application>#\1    <meta-data\n\1        android:name="io.flutter.embedding.android.EnableFlutterGPU"\n\1        android:value="true" />\n\1</application>#' "$MANIFEST"
          confere "$MANIFEST" 'android:name="io.flutter.embedding.android.EnableFlutterGPU"'
          echo "--- Manifest final ---"
          cat "$MANIFEST"
          # Ícone pequeno da notificação (só a transparência conta no Android).
          cp -r assets/icone/notificacao/. android/app/src/main/res/
          test -f android/app/src/main/res/drawable-xxhdpi/ic_stat_obrafacil.png || { echo "::error::ícone de notificação não foi copiado"; exit 1; }
          # flutter_local_notifications exige core library desugaring
          cat >> android/app/build.gradle.kts <<'EOF'

          android {
              compileOptions {
                  isCoreLibraryDesugaringEnabled = true
              }
          }

          dependencies {
              add("coreLibraryDesugaring", "com.android.tools:desugar_jdk_libs:2.1.4")
          }
          EOF
          echo "--- Fim do build.gradle.kts ---"
          tail -n 15 android/app/build.gradle.kts

      - name: Assinar com a chave fixa do app
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_SENHA: ${{ secrets.ANDROID_KEYSTORE_SENHA }}
        run: |
          # O login com Google exige o APK sempre com a mesma assinatura (as
          # impressões SHA-1 e SHA-256 dela ficam cadastradas no Firebase), e
          # com ela as atualizações instalam por cima da versão anterior. A
          # chave vem dos segredos do repositório, nunca do código. Sem eles,
          # o build segue com a chave temporária do runner.
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_SENHA" ]; then
            echo "::warning::Sem os segredos ANDROID_KEYSTORE_BASE64 e ANDROID_KEYSTORE_SENHA: o APK sai com uma chave temporária e o login com Google não funciona nele."
            exit 0
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/obra-na-mao.jks
          cat >> android/app/build.gradle.kts <<'EOF'

          android {
              signingConfigs {
                  create("fixa") {
                      storeFile = file("obra-na-mao.jks")
                      storePassword = System.getenv("ANDROID_KEYSTORE_SENHA")
                      keyAlias = "obranamao"
                      keyPassword = System.getenv("ANDROID_KEYSTORE_SENHA")
                  }
              }
              buildTypes {
                  getByName("release") {
                      signingConfig = signingConfigs.getByName("fixa")
                  }
              }
          }
          EOF

      - name: Dependências
        run: flutter pub get

      - name: Ícone do app e splash nativa
        run: |
          dart run flutter_launcher_icons
          dart run flutter_native_splash:create

      - name: Testes unitários (parsers e IA)
        run: flutter test

      - name: Análise estática
        run: flutter analyze

      - name: Build APK (release)
        env:
          ANDROID_KEYSTORE_SENHA: ${{ secrets.ANDROID_KEYSTORE_SENHA }}
          # Endereço da IA do assistente (variável do repositório, não é
          # segredo). Vazia: o "Perguntar" do app fica só com as regras.
          IA_URL: ${{ vars.IA_URL }}
        run: flutter build apk --release --dart-define=IA_URL="$IA_URL"

      - name: Conferir a assinatura do APK
        env:
          TEM_CHAVE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          # Com a chave fixa, a impressão SHA-1 tem de ser a cadastrada no
          # Firebase (senão o login com Google falha no celular).
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner"
          if [ ! -x "$APKSIGNER" ]; then
            echo "::warning::apksigner não encontrado; assinatura não conferida."
            exit 0
          fi
          "$APKSIGNER" verify --print-certs build/app/outputs/flutter-apk/app-release.apk | tee "$RUNNER_TEMP/assinatura.txt"
          if [ "$TEM_CHAVE" = "true" ]; then
            grep -qi "SHA-1 digest: 25d0dbaaad3e688558d38c2d34650c0cd35ae00a" "$RUNNER_TEMP/assinatura.txt" \
              || { echo "::error::O APK não saiu com a chave fixa do app (SHA-1 diferente da cadastrada no Firebase)."; exit 1; }
          fi

      - name: Renomear APK
        run: cp build/app/outputs/flutter-apk/app-release.apk obra-na-mao-${{ github.run_number }}.apk

      - name: Publicar na aba Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          # a tag aponta para o commit que foi compilado, não para a main
          target_commitish: ${{ github.sha }}
          name: 'Obra na Mão build ${{ github.run_number }}'
          body: 'APK gerado automaticamente do commit ${{ github.sha }}'
          files: obra_facil/obra-na-mao-${{ github.run_number }}.apk

      - name: Guardar APK como artefato (backup)
        uses: actions/upload-artifact@v4
        with:
          name: obra-na-mao-apk
          path: obra_facil/obra-na-mao-${{ github.run_number }}.apk
